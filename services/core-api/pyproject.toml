[project]
name = "core-api"
version = "0.1.0"
description = "FastAPI Core Gateway Service"
requires-python = ">=3.14"
dependencies = [
    "shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.4.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "redis>=5.0.8",
    "python-multipart>=0.0.9",
    "email-validator>=2.3.0",
]

[tool.uv.sources]
shared = { workspace = true }

[tool.uv]
package = false
