[project]
name = "shared"
version = "0.1.0"
description = "Shared domain models, schemas, and database configuration"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.35",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
